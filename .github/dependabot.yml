version: 2

# All updates (uv and GitHub Actions, major included) arrive as one weekly PR.
# One PR means no uv.lock conflicts between update PRs. If CI fails, the whole
# batch waits until it is fixed.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Tokyo
    # fix: release-please treats the update as a patch release
    commit-message:
      prefix: fix
      include: scope

updates:
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
