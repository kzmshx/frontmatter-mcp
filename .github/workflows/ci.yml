name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run catches new advisories and upstream breakage between dependency PRs
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --all-extras
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      # Slow tests load the real model; keep the download between runs
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-ruri-v3-30m
      - run: uv run pytest
      # Benchmarks are excluded from the default run; execute them once so they don't rot
      - run: uv run pytest tests/benchmarks --benchmark-disable -o addopts=""

  # The default install (no [semantic] extra, no dev tools): the server must
  # import and serve the non-semantic tools
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked --no-dev
      - run: uv run --no-sync python -c "import frontmatter_mcp.server"
      - run: uv run --no-sync --with pytest --with anyio pytest tests/test_mcp_client.py -p no:cacheprovider

  # What `uvx` users get: the newest versions pyproject.toml allows, ignoring uv.lock
  test-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv lock --upgrade
      - run: uv sync --all-extras
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Audit uv.lock
        run: |
          uv export --locked --all-extras --no-dev --no-hashes --no-emit-project -o locked.txt
          uvx pip-audit -r locked.txt --disable-pip --no-deps
      - name: Audit newest allowed versions
        run: |
          uv lock --upgrade
          uv export --all-extras --no-dev --no-hashes --no-emit-project -o latest.txt
          uvx pip-audit -r latest.txt --disable-pip --no-deps

  # Single required check for the branch ruleset
  ci-ok:
    if: always()
    needs: [lint, typecheck, test, test-core, test-latest, audit]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
