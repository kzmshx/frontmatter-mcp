[project]
name = "frontmatter-mcp"
version = "0.7.0"
description = "MCP server for querying Markdown frontmatter with DuckDB SQL"
authors = [{ name = "kzmshx" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.0.0,<3.0.0",
  "fastmcp>=3.2.0,<5.0.0",
  # The semantic package is imported by the server even when semantic search
  # is off (types, dependency wiring), and it uses numpy at import time
  "numpy>=1.24.0,<3.0.0",
  "pyarrow>=22.0.0,<27.0.0",
  "pydantic-settings>=2.7.0,<3.0.0",
  "python-frontmatter>=1.0.0,<2.0.0",
  "ruamel-yaml>=0.18.0,<1.0.0",
  # pydantic needs typing_extensions.TypedDict for output schemas on Python < 3.12
  "typing-extensions>=4.10.0",
]

[project.optional-dependencies]
semantic = [
  "scikit-learn>=1.1.0,<2.0.0",
  "scipy>=1.10.0,<2.0.0",
  "protobuf>=3.0.0,<8.0.0",
  "sentence-transformers>=2.0.0,<7.0.0",
  "sentencepiece>=0.1.0,<1.0.0",
]

[project.scripts]
frontmatter-mcp = "frontmatter_mcp.server:main"

[project.urls]
Homepage = "https://github.com/kzmshx/frontmatter-mcp"
Repository = "https://github.com/kzmshx/frontmatter-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frontmatter_mcp"]

[dependency-groups]
dev = [
    # The project with its semantic extra, so `uv sync` / `uv run` can run every test
    "frontmatter-mcp[semantic]",
    "mypy>=1.0.0",
    "pytest>=8.0.0",
    "pytest-benchmark>=5.0.0",
    "pytest-github-actions-annotate-failures>=0.2.0",
    "ruff>=0.14.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"]  # Allow Depends() in function defaults (FastMCP pattern)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/benchmarks"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/frontmatter_mcp"]

[[tool.mypy.overrides]]
module = ["duckdb", "frontmatter", "pyarrow", "scipy", "scipy.*", "sentence_transformers", "sklearn.*"]
ignore_missing_imports = true
